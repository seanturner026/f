# Herdr config, symlinked to ~/.config/herdr/config.toml by install.sh.
# Full reference: `herdr --default-config`
onboarding = false

[keys]
# opt+1..9 jumps straight to a tab (chat=1, nvim=2, shell=3), no prefix.
[keys.indexed]
tabs = "alt"

# Floating shell over the current tab (ctrl+b t); closes when the shell exits.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
width = "80%"
height = "80%"
